<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Product — PopFuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Lato:wght@400;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .product-detail { max-width: 1000px; margin: 0 auto; padding: 48px 20px 80px; display: grid; gap: 40px; }
  @media (min-width: 768px) { .product-detail { grid-template-columns: 1fr 1fr; } }
  .product-detail h1 { font-size: 30px; font-weight: 700; }
  .product-detail .price-row { font-family: var(--font-heading); font-weight: 700; font-size: 24px; color: var(--primary); margin: 18px 0; }
  .product-detail .badges { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .product-detail .desc-block { margin-top: 36px; padding-top: 22px; border-top: 1px solid rgba(184,80,66,0.1); }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">Pop<span>Fuel</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart</a>
    </nav>
    <div class="nav-icons">
      <a href="cart.html" aria-label="Cart">🛒<span class="cart-count" data-cart-count style="display:none;">0</span></a>
    </div>
    <button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menu">☰</button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart (<span data-cart-count>0</span>)</a>
  </div>
</header>

<div id="productRoot"></div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="footer-bottom-inner">
      <span id="footerYear"></span>
      <a href="shop.html" style="color:rgba(255,255,255,0.6);">← Back to Shop</a>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('footerYear').textContent = '© ' + new Date().getFullYear() + ' PopFuel';

  const slug = new URLSearchParams(window.location.search).get('slug');
  const product = getProductBySlug(slug);
  const root = document.getElementById('productRoot');

  if (!product) {
    root.innerHTML = `
      <div class="empty-state">
        <h1>Product not found</h1>
        <p>That flavour doesn't exist — check the link or go back to the shop.</p>
        <a href="shop.html" class="btn btn-primary">Back to Shop</a>
      </div>
    `;
  } else {
    document.getElementById('pageTitleTag').textContent = product.name + ' — PopFuel';

    const priceHtml = product.price != null
      ? `$${product.price.toFixed(2)}`
      : `<span class="price-tbd">Price TBD</span>`;
    const taglineHtml = product.tagline || `<span class="tbd-text">tagline pending</span>`;

    root.innerHTML = `
      <div class="product-detail">
        <div class="img-placeholder ratio-square">
          ${product.name}<br><small>photo pending</small>
        </div>
        <div>
          <h1>${product.name}</h1>
          <p style="color:rgba(51,51,51,0.6); margin-top:8px;">${taglineHtml}</p>
          <div class="price-row">${priceHtml}</div>
          <div class="badges">
            <span class="badge">${product.protein}g Protein</span>
            <span class="badge">${product.fibre}g Fibre</span>
            <span class="badge">Air-Popped</span>
          </div>
          <button class="btn btn-primary" id="addBtn" ${product.price == null ? 'disabled' : ''} onclick="handleAdd()">Add to Cart</button>
          <div class="desc-block">
            <h3 style="font-size:16px; font-weight:600; margin-bottom:8px;">Description</h3>
            <p class="tbd-text" style="font-size:14px;">Full product description pending — add once available.</p>
          </div>
        </div>
      </div>
    `;
  }

  function handleAdd() {
    addToCart(product.slug, 1);
    const btn = document.getElementById('addBtn');
    const original = btn.textContent;
    btn.textContent = 'Added ✓';
    setTimeout(() => { btn.textContent = original; }, 1200);
  }
</script>
</body>
</html>
